async function loadComplaintsFromSupabase() {
    const { data, error } = await supabaseClient
        .from("complaints")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Failed to load complaints:", error);
        showToast("Could not load complaints from server.", "error");
        return [];
    }

    complaintsCache = data.map(row => ({
        id: row.id,
        complaintType: row.complaint_type,
        complaintTypeName: row.complaint_type_name,
        title: row.title,
        formData: row.form_data,
        status: row.status,
        adminRemarks: row.admin_remarks,
        createdAt: row.created_at,
        updatedAt: row.updated_at,
        UserId: row.user_id,
        UserName: row.user_name,
        UserEmail: row.user_email,
        UserPhone: row.user_phone,
        UserAadhaar: row.user_aadhaar,
        UserAddress: row.user_address,
        priority: row.priority,
        resolution: row.resolution
    }));

    return complaintsCache;
}

      async function addComplaint(complaint) {
    const { error } = await supabaseClient
        .from("complaints")
        .insert([{
            id: complaint.id,
            complaint_type: complaint.complaintType,
            complaint_type_name: complaint.complaintTypeName,
            title: complaint.title,
            form_data: complaint.formData,
            status: complaint.status,
            admin_remarks: complaint.adminRemarks,
            created_at: complaint.createdAt,
            updated_at: complaint.updatedAt,
            user_id: complaint.UserId,
            user_name: complaint.UserName,
            user_email: complaint.UserEmail,
            user_phone: complaint.UserPhone,
            user_aadhaar: complaint.UserAadhaar,
            user_address: complaint.UserAddress,
            priority: complaint.priority,
            resolution: complaint.resolution
        }]);

    if (error) {
        console.error("Failed to save complaint:", error);
        throw error;
    }

    complaintsCache.unshift(complaint);
    return complaint;
}

      async function updateComplaint(complaintId, updates) {
    const { error } = await supabaseClient
        .from("complaints")
        .update({
            status: updates.status,
            admin_remarks: updates.adminRemarks,
            resolution: updates.resolution,
            updated_at: new Date().toISOString()
        })
        .eq("id", complaintId);

    if (error) {
        console.error("Failed to update complaint:", error);
        throw error;
    }

    await loadComplaintsFromSupabase();

    return true;
}

      function imageToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
        });
      }

      function attachComplaintTypeSelectionEvents() {

      function attachComplaintFormEvents(complaintType, typeConfig) {
        // Back button
        document.getElementById('backBtn')?.addEventListener('click', () => navigateTo('register'));
        
        // Image preview
        typeConfig.fields.filter(f => f.type === 'file').forEach(field => {
          const input = document.getElementById(field.name);
          if(input) {
            input.addEventListener('change', (e) => {
              const file = e.target.files[0];
              const previewDiv = document.getElementById(`${field.name}Preview`);
              if(file && previewDiv) {
                const reader = new FileReader();
                reader.onload = (event) => { previewDiv.innerHTML = `<img src="${event.target.result}" class="image-preview">`; };
                reader.readAsDataURL(file);
              }
            });
          }
        });
        
        // Form submission
        document.getElementById('complaintForm')?.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = {};
          for(const field of typeConfig.fields) {
            const element = document.getElementById(field.name);
            if(element) {
              if(field.type === 'file' && element.files[0]) {
                formData[field.name] = { fileName: element.files[0].name, fileData: await imageToBase64(element.files[0]) };
              } else {
                formData[field.name] = element.value;
              }
            }
          }
          
          let title = '';
          if(complaintType === 'bike_lost') title = `Bike Lost: ${formData.bikeRegNumber || 'Unknown'}`;
          else if(complaintType === 'phone_lost') title = `Phone Lost: ${formData.phoneModel || 'Unknown'}`;
          else if(complaintType === 'wallet_lost') title = `Wallet Lost: ${formData.walletType || 'Wallet'}`;
          else if(complaintType === 'document_lost') title = `Document Lost: ${formData.documentType || 'Document'}`;
          else if(complaintType === 'cyber_fraud') title = `Cyber Fraud: ${formData.fraudType || 'Scam'}`;
          else title = `Complaint: ${formData.otherSubject || 'Other'}`;
          
          const newComplaint = {
            id: generateComplaintId(),
            complaintType: complaintType,
            complaintTypeName: typeConfig.name,
            title: title,
            formData: formData,
            status: "pending",
            adminRemarks: "Complaint received. Admin will review shortly.",
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            UserId: currentUser.id,
            UserName: currentUser.fullName,
            UserEmail: currentUser.email,
            UserPhone: currentUser.phone,
            UserAadhaar: currentUser.aadhaar,
            UserAddress: currentUser.address,
            priority: complaintType === 'cyber_fraud' || complaintType === 'bike_lost' ? 'high' : 'medium',
            resolution: null
          };
          
          try {
    await addComplaint(newComplaint);

    showToast(
        `Complaint ${newComplaint.id} submitted! Admin will review.`,
        "success"
    );

    await loadComplaintsFromSupabase();
    navigateTo('dashboard');

} catch (error) {
    console.error(error);
    showToast("Failed to submit complaint. Please try again.", "error");
}
        });
        
        // Global navigation
        attachGlobalNavEvents();
      }

              formDataHtml += `<div><label class="font-semibold">${key}:</label><br><img src="${value.fileData}" class="image-preview"></div>`;
            } else if(value) {
              formDataHtml += `<div><label class="font-semibold">${key}:</label> ${value}</div>`;
            }
          }
        }
        
        const html = `

            ${renderNavbar()}

        `;
        root.innerHTML = html;
        
        document.getElementById('switchToAdminFromRegBtn')?.addEventListener('click', () => renderAdminLogin());
        document.getElementById('registerForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = document.getElementById('regName').value.trim();
          const email = document.getElementById('regEmail').value.trim();
          const phone = document.getElementById('regPhone').value.trim();
          const aadhaar = document.getElementById('regAadhaar').value.trim();
          const address = document.getElementById('regAddress').value.trim();
          const pwd = document.getElementById('regPassword').value;
          
          const users = getUsers();
          if(users.find(u => u.email === email)) {
            document.getElementById('regError').innerText = "Email already exists!";
            return;
          }
          if(!phone.match(/^\d{10}$/)) {
            document.getElementById('regError').innerText = "Enter valid 10-digit mobile number";
            return;
          }
          if(aadhaar.replace(/\D/g,'').length < 12) {
            document.getElementById('regError').innerText = "Enter valid Aadhaar number";
            return;
          }
          
          const newUser = { id: 'User_' + Date.now(), fullName: name, email, password: pwd, role: 'User', phone, aadhaar, address, createdAt: new Date().toISOString() };
          users.push(newUser);
          saveUsers(users);
          showToast("Registration successful! Please login.", "success");
          renderUserLogin();
        });
        document.getElementById('backToLogin')?.addEventListener('click', () => renderUserLogin());
      }

      // ==================== ADMIN FUNCTIONS (kept simple) ====================
      function renderAdminLogin() {
        const html = `
          <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-blue-900 to-slate-900 px-4">
            <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden">
              <div class="bg-gray-800 px-6 py-6 text-center">
                <i class="fas fa-shield-alt text-5xl text-yellow-400 mb-2"></i>
                <h1 class="text-2xl font-bold text-white">Admin Control Panel</h1>
              </div>
              <div class="p-8">
                <div id="loginError" class="mb-4 text-sm text-red-600 text-center"></div>
                <form id="loginForm">
                  <div class="mb-4"><label class="block text-gray-700 font-semibold mb-2">Admin Email</label><input type="email" id="adminEmail" class="w-full px-4 py-3 border rounded-lg" placeholder="admin@gov.in" required></div>
                  <div class="mb-6"><label class="block text-gray-700 font-semibold mb-2">Password</label><input type="password" id="adminPassword" class="w-full px-4 py-3 border rounded-lg" placeholder="••••••••" required></div>
                  <button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg transition">Admin Login</button>
                </form>
                <div class="mt-5 text-center text-xs text-gray-400">Demo: admin@gov.in / admin123</div>
              </div>
            </div>
          </div>
        `;
        root.innerHTML = html;
        
        document.getElementById('loginForm')?.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('adminEmail').value.trim();
          const pwd = document.getElementById('adminPassword').value;
          const users = getUsers();
          const adminUser = users.find(u => u.email === email && u.password === pwd && u.role === 'admin');
          if(adminUser) {
            setSession(adminUser, 'admin');
            currentUser = adminUser;
            renderAdminDashboard();
          } else {
            document.getElementById('loginError').innerText = "Invalid admin credentials";
          }
        });
      }

      async function renderAdminDashboard() {
    if(!currentUser || currentUser.role !== 'admin') {
        return renderAdminLogin();
    }

    await loadComplaintsFromSupabase();

    const complaints = getComplaints();
        const stats = {
          total: complaints.length,
          pending: complaints.filter(c => c.status === 'pending').length,
          investigating: complaints.filter(c => c.status === 'investigating').length,
          resolved: complaints.filter(c => c.status === 'resolved').length
        };

        const html = `
          <div class="min-h-screen bg-gray-100">
            <div class="bg-gray-800 text-white px-6 py-3 flex justify-between items-center flex-wrap gap-3">
              <div><i class="fas fa-shield-alt mr-2"></i> Admin: ${currentUser.fullName}</div>
              <button id="logoutBtn" class="bg-red-600 px-4 py-1 rounded text-sm hover:bg-red-700 transition">Logout</button>
            </div>
            <div class="max-w-7xl mx-auto px-4 py-6">
              <div class="grid grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-xl shadow text-center"><div class="text-2xl font-bold text-blue-600">${stats.total}</div><div>Total Complaints</div></div>
                <div class="bg-white p-4 rounded-xl shadow text-center"><div class="text-2xl font-bold text-yellow-600">${stats.pending}</div><div>Pending</div></div>
                <div class="bg-white p-4 rounded-xl shadow text-center"><div class="text-2xl font-bold text-orange-600">${stats.investigating}</div><div>Investigating</div></div>
                <div class="bg-white p-4 rounded-xl shadow text-center"><div class="text-2xl font-bold text-green-600">${stats.resolved}</div><div>Resolved</div></div>
              </div>
              
              <div class="bg-white rounded-xl shadow">
                <div class="p-4 border-b"><h2 class="text-xl font-bold">All User Complaints</h2></div>
                <div class="overflow-x-auto">
                  <table class="min-w-full">
                    <thead class="bg-gray-100">
                      <tr><th class="px-4 py-3">ID</th><th>User</th><th>Type</th><th>Title</th><th>Status</th><th>Priority</th><th>Filed On</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                      ${complaints.map(comp => `
                        <tr class="border-b hover:bg-gray-50">
                          <td class="px-4 py-3 font-mono text-sm">${comp.id}</td>
                          <td class="px-4 py-3">${comp.UserName}<br><span class="text-xs text-gray-500">${comp.UserPhone}</span></td>
                          <td class="px-4 py-3 text-sm">${complaintTypeNames[comp.complaintType]}</td>
                          <td class="px-4 py-3 max-w-xs truncate">${comp.title}</td>
                          <td class="px-4 py-3"><span class="px-2 py-1 rounded-full text-xs ${comp.status === 'resolved' ? 'bg-green-100 text-green-700' : comp.status === 'investigating' ? 'bg-orange-100 text-orange-700' : 'bg-yellow-100 text-yellow-700'}">${comp.status}</span></td>
                          <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs ${comp.priority === 'critical' ? 'bg-red-100' : 'bg-gray-100'}">${comp.priority}</span></td>
                          <td class="px-4 py-3 text-xs">${new Date(comp.createdAt).toLocaleDateString()}</td>
                          <td class="px-4 py-3"><button data-id="${comp.id}" class="respondBtn bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700 transition">Respond</button></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
                ${complaints.length === 0 ? '<div class="text-center py-10 text-gray-400">No complaints received yet</div>' : ''}
              </div>
            </div>
          </div>
        `;
        root.innerHTML = html;
        
        document.getElementById('logoutBtn')?.addEventListener('click', () => { clearSession(); renderAdminLogin(); });
        document.querySelectorAll('.respondBtn').forEach(btn => {
          btn.addEventListener('click', () => renderAdminResponse(btn.getAttribute('data-id')));
        });
      }

      function renderAdminResponse(compId) {
        const complaints = getComplaints();
        const complaint = complaints.find(c => c.id === compId);
        if(!complaint) return renderAdminDashboard();
        
        const html = `
          <div class="min-h-screen bg-gray-100 py-8 px-4">
            <div class="max-w-4xl mx-auto">
              <button id="backBtn" class="mb-4 text-blue-600 hover:underline"><i class="fas fa-arrow-left"></i> Back</button>
              <div class="grid lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow">
                  <div class="bg-gray-800 text-white px-6 py-4"><h2 class="text-xl font-bold">Complaint #${complaint.id}</h2></div>
                  <div class="p-6 space-y-3">
                    <p><span class="font-bold">User:</span> ${complaint.UserName} (${complaint.UserPhone})</p>
                    <p><span class="font-bold">Type:</span> ${complaintTypeNames[complaint.complaintType]}</p>
                    <p><span class="font-bold">Title:</span> ${complaint.title}</p>
                    <p><span class="font-bold">Description:</span> ${complaint.formData?.lostDescription || complaint.formData?.fraudDescription || complaint.formData?.incidentDescription || 'No description'}</p>
                    <p><span class="font-bold">Current Status:</span> <span class="px-2 py-1 rounded text-xs ${complaint.status === 'resolved' ? 'bg-green-100' : 'bg-yellow-100'}">${complaint.status}</span></p>
                  </div>
                </div>
                <div class="bg-white rounded-xl shadow">
                  <div class="bg-green-800 text-white px-6 py-4"><h2 class="text-xl font-bold">Admin Response</h2></div>
                  <div class="p-6">
                    <form id="responseForm" class="space-y-4">
                      <div><label class="font-semibold">Update Status</label><select id="statusSelect" class="w-full border rounded-lg p-3"><option value="pending" ${complaint.status === 'pending' ? 'selected' : ''}>Pending</option><option value="investigating" ${complaint.status === 'investigating' ? 'selected' : ''}>Investigating</option><option value="resolved" ${complaint.status === 'resolved' ? 'selected' : ''}>Resolved</option></select></div>
                      <div><label class="font-semibold">Admin Remarks</label><textarea id="adminRemarks" rows="4" class="w-full border rounded-lg p-3" placeholder="Response to User...">${complaint.adminRemarks || ''}</textarea></div>
                      <div id="resolutionDiv" style="display: ${complaint.status === 'resolved' ? 'block' : 'none'}"><label class="font-semibold">Resolution Summary</label><textarea id="resolution" rows="2" class="w-full border rounded-lg p-3" placeholder="How was this resolved?">${complaint.resolution || ''}</textarea></div>
                      <button type="submit" class="w-full bg-green-700 hover:bg-green-800 text-white py-3 rounded-lg font-semibold transition">Submit Response</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        root.innerHTML = html;
        
        document.getElementById('backBtn')?.addEventListener('click', () => renderAdminDashboard());
        document.getElementById('statusSelect')?.addEventListener('change', (e) => {
          document.getElementById('resolutionDiv').style.display = e.target.value === 'resolved' ? 'block' : 'none';
        });
       document.getElementById('responseForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();

    const updates = {
        status: document.getElementById('statusSelect').value,
        adminRemarks: document.getElementById('adminRemarks').value,
        resolution: document.getElementById('resolution')?.value || null
    };

    try {
        await updateComplaint(complaint.id, updates);

        showToast(
            "Response sent! User can now see the update.",
            "success"
        );

        await renderAdminDashboard();

    } catch (error) {
        console.error(error);

        showToast(
            "Failed to update complaint.",
            "error"
        );
    }
});
      }

      // Start the app
      const session = getSession();
      if(session && session.user) {
        currentUser = session.user;
        currentPortal = session.portal;
        if(currentPortal === 'User') {
          currentPage = 'dashboard';
          renderUserDashboard();
        } else {
          renderAdminDashboard();
        }
      } else {
        renderUserLogin();
      }
    })();
  </script>
</body>
</html>
